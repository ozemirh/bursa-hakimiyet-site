<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel girişi — Bursa Hakimiyet</title>
{% load static %}
<link rel="stylesheet" href="{% static 'stil/fontlar.css' %}">
<link rel="stylesheet" href="{% static 'stil/panel.css' %}">
</head>
<body class="giris-sayfa">
  <main class="giris-kutu">
    <h1>Yönetim Paneli</h1>
    {% if form.errors %}<p class="hata" role="alert">Kullanıcı adı ya da parola hatalı.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="alan"><label for="id_username">Kullanıcı adı</label>{{ form.username }}</div>
      <div class="alan"><label for="id_password">Parola</label>{{ form.password }}</div>
      <button type="submit" class="dugme">Giriş</button>
    </form>
  </main>
</body>
</html>
