# Bursa Hakimiyet — PostgreSQL ayar ÖNERİSİ (üretim)
#
# Paket L2, 19 Ekim 2026. Hedef makine dagitim/KURULUM.md §1: 4 vCPU,
# 16 GB RAM, NVMe; nginx + gunicorn (2×çekirdek+1 = 9 sync işçi) +
# PostgreSQL aynı makinede. Ubuntu'da:
#
#   sudo install -m 0644 dagitim/postgresql/bursahakimiyet.conf \
#        /etc/postgresql/16/main/conf.d/bursahakimiyet.conf
#   sudo systemctl restart postgresql      # shared_buffers yeniden başlatma ister
#   sudo -u postgres psql -c "SELECT name, setting, pending_restart
#        FROM pg_settings WHERE name IN ('shared_buffers','jit','work_mem')"
#
# Debian/Ubuntu paketinin postgresql.conf'u `include_dir = 'conf.d'` taşır;
# bu dosya ana dosyaya DOKUNMADAN üstüne yazar. Yeni bir değer eklemeden
# önce ölçün: aşağıdaki her satırın gerekçesi bir ölçüme bağlı.
#
# ÖLÇÜM ZEMİNİ — yerel PG 18 (Windows, 16 GB RAM, 16 çekirdek, SSD),
# 1.038.477 haber, veritabanı 3,9 GB (icerik_haber yığını 1,3 GB, toplam
# 2,8 GB; icerik_haberarama 652 MB + GIN'ler ~350 MB). Sayfa ölçüm tablosu
# ve önce/sonra değerleri Paket L2 raporunda.

# --- bellek -----------------------------------------------------------------

# Veritabanının sıcak kümesi (haber yığını + okur indeksleri + arama tablosu
# ve GIN'leri) ~3 GB. 1 GB'lık tamponla rastgele arşiv sayfalarında aday
# sorgusunun ilk çalışması diskten okuyordu ("Buffers: shared read=…",
# ilk koşu 50–117 ms, ikinci koşu 13–16 ms). RAM'in %25'i: kümenin
# tamamı sığar, kalan bellek işletim sistemi önbelleğine (arşiv görselleri
# nginx'ten, sayfa önbelleği) kalır.
shared_buffers = 4GB

# Planlayıcıya "veri büyük olasılıkla bellekte" bilgisi: shared_buffers +
# işletim sistemi önbelleğinin beklenen payı. Yalnız tahmin girdisi, bellek
# ayırmaz. 16 GB'ın ~%60'ı.
effective_cache_size = 10GB

# Sıralama/karma başına. Site haritası ay özeti 177 grup, 4 MB karma
# tablosu kullanıyor; menü sayımı 13 grup. 32 MB bütün okur sorgularını
# bellekte tutar. Bağlantı sayısı küçük (aşağıda) olduğu için en kötü
# durum (50 × birkaç düğüm × 32 MB) makineyi zorlamaz.
work_mem = 32MB

# İndeks kurma ve VACUUM. 0018 ifade GIN'i 6,9 sn, 0015'in btree'leri
# 20–80 sn; göç ve indeks eklemede hızlandırır, yalnız bakım sırasında
# ayrılır.
maintenance_work_mem = 1GB

# --- planlayıcı ---------------------------------------------------------------

# NVMe/SSD: rastgele okuma sıralıya yakın. 4,0 (döner disk varsayımı)
# kapsayan indeksler yerine tam taramayı öne çıkarıyordu; yerel küme
# baştan beri 1,1 ile ölçüldü.
random_page_cost = 1.1

# Linux'ta bitmap yığın taramasının önden okuması (posix_fadvise). İlgili
# haber ve arama sorguları `Bitmap Heap Scan` ile yüzlerce dağınık sayfa
# okuyor; NVMe kuyruk derinliğinden yararlanır. (Windows'ta etkisiz.)
effective_io_concurrency = 200

# JIT KAPALI. Site kısa OLTP sorguları çalıştırıyor; JIT yalnız tahmini
# maliyeti jit_above_cost (100.000) aşan sorguda devreye girer ve derleme
# bedeli (onlarca–yüzlerce ms, satır başına kazancı ise milisaniyeler)
# sorgunun kendisinden büyük olabilir. EXPLAIN'de eşiği aşan okur sorgusu:
# site haritası ay özeti (toplam cost 101.548; önbellek dolarken çalışır).
# Menü sayımı (13.928), okur sayfaları (< 10.000) eşiğin altında. Yerel
# Windows kurulumunda JIT derlenmemiş (pg_jit_available() = false), yani
# bütün ölçümler JIT'siz; bu satır üretimi ölçülen koşula getirir. Sorgu
# başına gerekirse `SET jit = on` ile açılır.
jit = off

# Paralel işçi: Windows'ta ölçüldü, toplam/menü/site haritası sayımlarında
# 0 ile 2 işçi arasında fark yok (53,7/57,8 · 81,0/76,5 · 524,9/532,4 ms).
# Varsayılan (2) bırakılıyor; okur sorguları zaten paralel plana girmiyor.
#max_parallel_workers_per_gather = 2

# --- bağlantı ---------------------------------------------------------------

# 9 gunicorn işçisi × 1 kalıcı bağlantı (CONN_MAX_AGE=60) + zamanlanmış
# komutlar + yönetim. 100 (varsayılan) gereksiz; düşük tutmak work_mem'in
# en kötü toplamını da sınırlar.
max_connections = 50

# --- yazma ve kontrol noktası ---------------------------------------------

# Toplu göç ve arama_doldur sırasında sık kontrol noktası yazmayı
# yavaşlatıyordu; yerel kümede baştan beri bu değerlerle.
max_wal_size = 4GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- gözlem -----------------------------------------------------------------

# EXPLAIN (ANALYZE, BUFFERS) çıktısına G/Ç süresi ekler; "yavaş çünkü
# diskten okudu" ile "yavaş çünkü CPU" ayrımı ancak bununla yapılır.
# Linux'ta saat okuma ucuz (pg_test_timing ile doğrulanabilir).
track_io_timing = on

# Uygulama kendi yavaş sorgu günlüğünü tutuyor (BH_YAVAS_SORGU_MS=200,
# icerik/yavas_sorgu.py); veritabanı tarafı yalnız uygulamanın görmediği
# sorgular (psql, bakım) için geniş eşikle.
log_min_duration_statement = 1000
log_autovacuum_min_duration = 10s

# --- isteğe bağlı: büyük sayfa ---------------------------------------------
# 4 GB tampon için Linux'ta büyük sayfa TLB kaybını azaltır; çekirdek
# ayarı (vm.nr_hugepages ≈ 2.100 × 2 MB) gerektirir. "try" ayar yoksa
# sessizce normal sayfaya düşer.
huge_pages = try
