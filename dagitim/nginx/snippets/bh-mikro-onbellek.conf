# /etc/nginx/snippets/bh-mikro-onbellek.conf — anonim HTML mikro önbelleği.
#
# Süre 10 sn (5–30 aralığında; son dakika haberi en geç 10 sn gecikir).
# Yoğun anlarda: aynı adrese aynı anda gelen istekleri tek istekle karşıla
# (lock), arka planda tazele, uygulama düşerse eski kopyayı ver (stale).
proxy_cache bh_html;
proxy_cache_key "$scheme$host$request_uri|$bh_kodlama";
proxy_cache_valid 200 301 10s;
proxy_cache_valid 404 5s;
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_background_update on;
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
proxy_cache_revalidate on;

# Oturumlu istek (panel kullanıcısı siteyi geziyor) önbelleği ne okur ne
# yazar: sayfada ona özel düğmeler (reklam anahtarı, test reklamı) var.
proxy_cache_bypass $bh_oturumlu $http_authorization;
proxy_no_cache     $bh_oturumlu $http_authorization;

# `Vary: Cookie` yok sayılır (gerekçe: bursahakimiyet.conf, map bölümü).
# Set-Cookie taşıyan yanıt (CSRF çerezi, oturum) nginx'te zaten önbelleğe
# girmez; Cache-Control: private/no-store (ör. /_durum, panel) da girmez.
proxy_ignore_headers Vary;

add_header X-Onbellek $upstream_cache_status always;
