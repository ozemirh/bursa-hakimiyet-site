# /etc/nginx/snippets/bh-tls.conf — TLS (Let's Encrypt, certbot).
#
# Cloudflare önde olacaksa "Full (strict)" kipi: kökende yine geçerli
# sertifika gerekir (Let's Encrypt ya da Cloudflare Origin sertifikası).
ssl_certificate     /etc/letsencrypt/live/www.bursahakimiyet.com.tr/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/www.bursahakimiyet.com.tr/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:bh_tls:20m;
ssl_session_timeout 1d;
ssl_session_tickets off;
# HSTS başlığını Django yazar (BH_HSTS_*): değer tek yerde yönetilsin.
