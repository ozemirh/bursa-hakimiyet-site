# /etc/nginx/snippets/bh-vekil.conf — gunicorn'a giden her istek.
#
# X-Forwarded-Proto'yu nginx HER ZAMAN kendisi yazar (istemcinin gönderdiği
# ezilir). Django `SECURE_PROXY_SSL_HEADER` buna güvenir; istemciden geçen
# bir başlık güvenlik açığı olurdu.
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP         $remote_addr;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_redirect off;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
# Yanıtı tamponla: yavaş okur gunicorn işçisini tutmasın (sync işçi).
proxy_buffering on;
proxy_buffers 16 64k;
proxy_busy_buffers_size 128k;
