# Bursa Hakimiyet — nginx (Ubuntu 24.04: nginx 1.24)
#
# HTTP/2: 1.24'te `listen … ssl http2`. nginx ≥ 1.25.1'e geçilirse
# `http2` listen'den çıkarılıp sunucu bloğuna `http2 on;` yazılır.
#
# YALNIZ DOSYA: hiçbir yere kurulmadı. Kurulum adımları dagitim/KURULUM.md.
# Yerleşim: /etc/nginx/sites-available/bursahakimiyet.conf → sites-enabled.
#
# Dizinler (KURULUM.md ile aynı):
#   /srv/bursahakimiyet/statik          collectstatic (BH_STATIK_KOK)
#   /srv/bursahakimiyet/sitemap         site_haritasi_uret (BH_SITE_HARITASI_KOK)
#   /srv/bursahakimiyet/arsiv/gorseller arşiv görselleri (BH_ARSIV_KOK/gorseller)
#   /srv/bursahakimiyet/turev           görsel türevleri (paket D, /gorsel/; BH_TUREV_KOK)
#   127.0.0.1:8001                      uygulama (gunicorn)
#
# HTML önbelleği: uygulamanın kendi 30 sn'lik sayfa önbelleği var (paket
# A, CACHES["sayfa"]) ve okunma sayımı o katmanda yapılıyor. nginx mikro
# önbelleği VARSAYILAN KAPALI: açılırsa nginx'ten dönen istekler Django'ya
# hiç ulaşmaz ve okunma sayısı düşer. Açma koşulu KURULUM.md §7a.

# ---------------------------------------------------------------- http {} --
# (Bu bölüm site dosyasında da durabilir; nginx sites-enabled'ı http
#  bağlamında içe alır.)

# Anonim HTML mikro önbelleği. inactive kısa: son dakikada eski sayfa durmaz.
proxy_cache_path /var/cache/nginx/bh_html levels=1:2 keys_zone=bh_html:50m
                 max_size=2g inactive=10m use_temp_path=off;
# /gorsel/ türevleri diskte yoksa üretilen yanıtın önbelleği.
proxy_cache_path /var/cache/nginx/bh_gorsel levels=1:2 keys_zone=bh_gorsel:50m
                 max_size=20g inactive=30d use_temp_path=off;

# Önbellek anahtarına yalnız "gzip kabul ediyor mu" girer. Django
# `Vary: Cookie, Accept-Encoding` gönderir; Cookie'ye göre ayırmak (her
# okurun analitik çerezi farklı) önbelleği işe yaramaz kılar. Oturum çerezi
# olan istek zaten önbelleği atlar (aşağıda), kalan çerezler sayfayı
# değiştirmez (okur sayfalarında çerez okunmuyor — ölçüldü, 19 Ekim 2026).
map $http_accept_encoding $bh_kodlama {
    default "";
    "~*gzip" "gz";
}
map $cookie_sessionid $bh_oturumlu {
    default 1;
    ""      0;
}

# Kötüye kullanım sınırları. Arama sonuçsuz sorguda saniyeler sürüyor
# (DEGERLENDIRME §3/9): bir IP'nin işçileri kilitlemesine izin verme.
limit_req_zone $binary_remote_addr zone=bh_ara:10m   rate=2r/s;
limit_req_zone $binary_remote_addr zone=bh_giris:10m rate=10r/m;
limit_req_status 429;

upstream bh_uygulama {
    server 127.0.0.1:8001 fail_timeout=0;
}

# ------------------------------------------------------------------ :80 --
server {
    listen 80;
    listen [::]:80;
    server_name www.bursahakimiyet.com.tr bursahakimiyet.com.tr;

    # Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    # Makinenin kendi sağlık yoklaması düz HTTP'den (Django bu adresi SSL
    # yönlendirmesinden muaf tutar). Dışarıya kapalı.
    location = /_durum {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include /etc/nginx/snippets/bh-vekil.conf;
        proxy_pass http://bh_uygulama;
    }
    location / {
        return 301 https://www.bursahakimiyet.com.tr$request_uri;
    }
}

# --------------------------------------------- :443 çıplak alan → www --
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bursahakimiyet.com.tr;
    include /etc/nginx/snippets/bh-tls.conf;
    return 301 https://www.bursahakimiyet.com.tr$request_uri;
}

# ------------------------------------------------------------ :443 www --
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bursahakimiyet.com.tr;
    include /etc/nginx/snippets/bh-tls.conf;

    # Cloudflare arkasındaysak gerçek okur IP'si (limit_req ve günlük için).
    # Cloudflare kullanılmıyorsa bu satır zararsızdır: yalnız CF aralıklarına
    # güvenir.
    include /etc/nginx/snippets/bh-cloudflare-ip.conf;

    access_log /var/log/nginx/bh.access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/bh.error.log warn;

    client_max_body_size 25m;

    # --- sıkıştırma. Django HTML'i kendisi gzip'liyor (Content-Encoding
    # varsa nginx dokunmaz); bu blok nginx'in doğrudan verdiği dosyalar
    # (site haritası, özetsiz statik) içindir.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml application/javascript
               application/json application/xml application/rss+xml
               image/svg+xml;
    # Brotli: Ubuntu 24.04'te `libnginx-mod-http-brotli-filter` ve
    # `-static` paketleri. Kuruluysa açın:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css text/plain text/xml application/javascript
    #              application/json application/xml application/rss+xml
    #              image/svg+xml;

    # --- statik: collectstatic çıktısı. Özetli ad (site.5e65856fa907.css)
    # içerik değişince değişir → bir yıl + immutable. Özetsiz ad 1 saat.
    # .gz/.br kopyalarını collectstatic üretti; nginx hazır olanı verir.
    location /statik/ {
        root /srv/bursahakimiyet;
        gzip_static on;
        # brotli_static on;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
        location ~* "\.[0-9a-f]{12}\.[a-z0-9]+$" {
            gzip_static on;
            # brotli_static on;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            # Yazı tipleri preload ile CORS kipinde istenir.
            add_header Access-Control-Allow-Origin "*" always;
        }
    }

    # --- site haritaları: canlıyla AYNI adres, özetsiz. Dosya yoksa
    # Django görünümü üretir (yavaş ama doğru).
    location /static/sitemap/ {
        alias /srv/bursahakimiyet/sitemap/;
        types { application/xml xml; }
        charset utf-8;
        charset_types application/xml;
        add_header Cache-Control "public, max-age=300" always;
        error_page 404 = @uygulama;
    }

    # --- arşiv görselleri: Django'ya hiç uğramaz. Dosyalar değişmez.
    location /arsiv-gorsel/ {
        alias /srv/bursahakimiyet/arsiv/gorseller/;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # --- görsel türevleri (paket D, 0dca9b8). Adres sözleşmesi:
    #   /gorsel/<320|480|640|960|1280>/<kaynak yol>.webp → <TUREV_KOK>/<genişlik>/<kaynak yol>.webp
    #   /gorsel/og/<kaynak yol>.jpg                      → <TUREV_KOK>/og/<kaynak yol>.jpg
    # TUREV_KOK = BH_TUREV_KOK (burada /srv/bursahakimiyet/turev); verilmezse
    # uygulama ARSIV_KOK/turev kullanır — ikisi AYNI yer olmalı.
    # Türev diskteyse nginx verir; yoksa Django üretip diske yazar, nginx
    # yanıtı 30 gün önbellekler. Sıkıştırma YOK (webp/jpg zaten sıkışık).
    # Türevler yeniden üretilebilir; WhiteNoise'a girmez.
    location ~ ^/gorsel/((?:320|480|640|960|1280|og)/.+)$ {
        root /srv/bursahakimiyet/turev;
        try_files /$1 @gorsel_uret;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location @gorsel_uret {
        include /etc/nginx/snippets/bh-vekil.conf;
        proxy_pass http://bh_uygulama;
        proxy_cache bh_gorsel;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
    }

    # --- Django'nun izinli dosya teslimi (X-Accel-Redirect). Görünüm yetki
    # / varlık denetimini yapar, dosyayı nginx gönderir. Dışarıdan erişilmez.
    location /_ic/arsiv/ {
        internal;
        alias /srv/bursahakimiyet/arsiv/gorseller/;
    }
    location /_ic/turev/ {
        internal;
        alias /srv/bursahakimiyet/turev/;
    }

    # --- panel ve yönetim: önbellek YOK, giriş denemesi sınırlı.
    location = /panel/giris {
        limit_req zone=bh_giris burst=5 nodelay;
        include /etc/nginx/snippets/bh-vekil.conf;
        proxy_pass http://bh_uygulama;
    }
    location /panel/ {
        include /etc/nginx/snippets/bh-vekil.conf;
        proxy_pass http://bh_uygulama;
        proxy_read_timeout 120s;
    }
    location /yonetim/ {
        include /etc/nginx/snippets/bh-vekil.conf;
        proxy_pass http://bh_uygulama;
    }
    location = /_durum {
        include /etc/nginx/snippets/bh-vekil.conf;
        proxy_pass http://bh_uygulama;
        access_log off;
    }

    # --- arama: sınırlı, kısa önbellekli (aynı sorgu aynı sonucu verir).
    location = /ara {
        limit_req zone=bh_ara burst=10 nodelay;
        include /etc/nginx/snippets/bh-vekil.conf;
        # include /etc/nginx/snippets/bh-mikro-onbellek.conf;  # VARSAYILAN KAPALI, KURULUM.md §7a
        proxy_pass http://bh_uygulama;
    }

    # --- okur sayfaları: anonim istek 10 sn mikro önbellekten.
    location / {
        include /etc/nginx/snippets/bh-vekil.conf;
        # include /etc/nginx/snippets/bh-mikro-onbellek.conf;  # VARSAYILAN KAPALI, KURULUM.md §7a
        proxy_pass http://bh_uygulama;
    }

    location @uygulama {
        include /etc/nginx/snippets/bh-vekil.conf;
        # include /etc/nginx/snippets/bh-mikro-onbellek.conf;  # VARSAYILAN KAPALI, KURULUM.md §7a
        proxy_pass http://bh_uygulama;
    }
}
